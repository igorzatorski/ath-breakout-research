[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ath-breakout-systematic"
version = "0.1.0"
description = "Systematic equity research platform for ATH breakout strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pandas-market-calendars>=5.1",
    "pyarrow>=17",
    "plotly>=6.0",
    "tabulate>=0.9",
    "yfinance>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
wrds = [
    "keyring>=25",
    "wrds>=3.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
